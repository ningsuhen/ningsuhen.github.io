name: Standalone page check

on:
  pull_request:

permissions:
  contents: read

# One build, then the checks fan out in parallel. The aggregate `check` job is the single required
# status for branch protection; the individual legs are for diagnosis. Browser legs retry only on
# browser-launch (infra) failures, never on assertion failures.
#
# Browser legs get 15 min: that covers setup (pnpm install + the Playwright browser, ~1-2 min on a
# warm cache, more on a cold one) plus the check itself, with margin. The 8 min that used to sit here
# was eaten by setup (the apt --with-deps install ran ~6 min), leaving the check ~1 min before the job
# was killed — see the setup-timing summary each leg writes to the job summary.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Vite/Astro
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tts
      - run: pnpm test:drafts
      - run: pnpm test:markers
      - run: pnpm test:voice
      - run: pnpm test:dates
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  static:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - name: script syntax
        run: pnpm check:syntax
      - name: astro check
        run: pnpm check
      - name: thumbnails
        run: pnpm check:thumbnails
      - name: source map
        run: pnpm check:source-map
      - name: owner markers
        run: pnpm check:markers
      - name: owner voice
        run: pnpm check:voice
      - name: internal links
        run: pnpm check:links
      - name: 404 page + rss.xml (no network)
        run: node scripts/check-external-links.mjs --no-network
      - name: seo (noindex, canonical, sitemap, robots)
        run: pnpm check:seo
      - name: fragment contract
        run: pnpm check:export
      - name: leaks (incl. embedded payloads)
        run: pnpm check:leaks

  standalone:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: check:standalone
        run: bash scripts/ci-check.sh standalone "pnpm check:standalone"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: standalone-failure
          path: standalone.log
          retention-days: 7

  report-history:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: check:report-history
        run: bash scripts/ci-check.sh report-history "pnpm check:report-history"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-history-failure
          path: report-history.log
          retention-days: 7

  # theme and navigation are separate legs: together they are the slowest pair and a single
  # 8-minute job times out on CI runners; split so each gets its own budget.
  theme:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: check:theme
        run: bash scripts/ci-check.sh theme "pnpm check:theme"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: theme-failure
          path: theme.log
          retention-days: 7

  navigation:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: check:navigation
        run: bash scripts/ci-check.sh navigation "pnpm check:navigation"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: navigation-failure
          path: navigation.log
          retention-days: 7

  listen:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: check:listen
        env:
          LISTEN_SHOTS: listen-shots
        run: bash scripts/ci-check.sh listen "pnpm check:listen"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: listen-failure
          path: |
            listen.log
            listen-shots/
          retention-days: 7

  design-system:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: check:design-system
        run: bash scripts/ci-check.sh design-system "pnpm check:design-system"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: design-system-failure
          path: design-system.log
          retention-days: 7

  dates:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: check:dates
        run: bash scripts/ci-check.sh dates "pnpm check:dates"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: dates-failure
          path: dates.log
          retention-days: 7

  # Core Web Vitals budget: LCP/CLS/TBT on a fixed page set, mobile + desktop, under a CPU throttle, median of N
  # runs, no external requests. Fails only on a budget breach (scripts/cwv-budget.json).
  cwv:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: check:cwv
        run: bash scripts/ci-check.sh cwv "pnpm check:cwv"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cwv-failure
          path: cwv.log
          retention-days: 7

  # Visual regression: screenshot every page at 375/768/1440, light and dark, and pixelmatch against the
  # last master baseline (the visual-baseline branch). Deterministic: baseline and candidate render on the
  # same ubuntu-latest runner (same fonts, same chromium), animations off, external requests blocked.
  # Bootstrap: with no baseline branch yet it passes (the visual-baseline workflow generates it on master).
  visual:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - uses: ./.github/actions/playwright-env
      - name: Fetch the baseline branch
        run: |
          if git ls-remote --exit-code --heads origin visual-baseline >/dev/null 2>&1; then
            git clone --depth 1 --branch visual-baseline --single-branch https://github.com/${{ github.repository }}.git visual-baseline-ref
          else
            echo "no visual-baseline branch yet (first run)"
          fi
      - name: check:visual
        run: bash scripts/ci-check.sh visual "pnpm check:visual --compare visual-baseline-ref/visual-baseline"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure
          path: |
            visual.log
          retention-days: 7

  # Aggregate status: the single required check for branch protection. Fails if any leg fails.
  check:
    runs-on: ubuntu-latest
    needs: [static, standalone, report-history, theme, navigation, listen, design-system, dates, cwv, visual]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Aggregate result
        run: |
          failed=0
          for j in ${{ needs.static.result }} ${{ needs.standalone.result }} ${{ needs.report-history.result }} ${{ needs.theme.result }} ${{ needs.navigation.result }} ${{ needs.listen.result }} ${{ needs.design-system.result }} ${{ needs.dates.result }} ${{ needs.cwv.result }} ${{ needs.visual.result }}; do
            if [ "$j" != "success" ]; then
              echo "::error::a check leg did not pass (result: $j)"
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then exit 1; fi
          echo "all check legs passed"
