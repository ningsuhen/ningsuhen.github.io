name: Visual baseline

# Regenerates the visual regression baseline on every master push. The PNGs live on the `visual-baseline`
# branch (master itself carries no binaries). The branch is master + the baseline folder, kept current by
# merging master into it and regenerating — a plain push, no force-push.
#
# The commit + push happen in a SEPARATE clean clone, not the main checkout. The main checkout runs
# `pnpm install`, whose `prepare` step installs our `.githooks` pre-commit into its `.git/hooks`; that hook
# fails closed when `gitleaks` is absent on the runner, so a `git commit` there aborts (run 40268345713).
# A fresh clone never ran `pnpm install`, so it has no hooks — no `--no-verify`, no hooksPath tricks.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baseline
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GITHUB_TOKEN is not always in a step's shell env; map it explicitly so the push authenticates.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Check out master (the new code) and build it; the baseline PNGs are written to ./visual-baseline.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./.github/actions/playwright-env
      - name: Regenerate the baseline
        run: pnpm check:visual --generate visual-baseline
      - name: Commit + push to visual-baseline (clean clone, no hooks)
        run: |
          # Fresh clone: no `pnpm install`, so no .githooks pre-commit to fail closed on the runner.
          # Clone plain (the repo is public). Authenticate the push with a LOCAL credential helper — the
          # same mechanism actions/checkout uses on this runner. A tokenized URL does not work for the push
          # (git strips credentials from the stored remote and the fresh clone has no helper), so the push
          # goes out unauthenticated. The helper is single-quoted, so only the ${GITHUB_TOKEN} placeholder
          # is stored in .git/config; the value is expanded in the helper's subshell at push time and never
          # lands in the config or the logs.
          # Diagnostic: is GITHUB_TOKEN set in this step? An empty token gives exactly "Invalid username or
          # token" for both the tokenized URL and this helper, while a tokenless clone of a public repo works.
          # Print only whether it is non-empty — never the value.
          [ -n "$GITHUB_TOKEN" ] && echo "GITHUB_TOKEN: set" || echo "GITHUB_TOKEN: EMPTY"
          clone="$(mktemp -d)"
          git clone --quiet --no-checkout "https://github.com/${{ github.repository }}.git" "$clone"
          cd "$clone"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'
          # Target branch: a master push updates the real baseline; any workflow_dispatch is a test run and
          # goes to a throwaway branch — never visual-baseline and never master.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then TARGET="visual-baseline"; else TARGET="visual-baseline-test"; fi
          # The branch is the current ref + the baseline folder. For the real baseline, keep it current by
          # merging master; for a test run, base it on the exact dispatched commit (GITHUB_SHA).
          if [ "$TARGET" = "visual-baseline" ] && git show-ref --verify --quiet refs/remotes/origin/visual-baseline; then
            git checkout -B visual-baseline origin/visual-baseline
            git merge --no-edit origin/master
          else
            git checkout -B "$TARGET" "$GITHUB_SHA"
          fi
          # Copy the freshly generated PNGs from the main checkout (overwrite; stale files are harmless —
          # check:visual compares candidates against the baseline, never the reverse).
          mkdir -p ./visual-baseline
          cp -R "${GITHUB_WORKSPACE}/visual-baseline/." ./visual-baseline/
          git add -A visual-baseline
          if git diff --staged --quiet; then
            echo "baseline unchanged"
          else
            git commit -m "visual: baseline $(date -u +%Y-%m-%d)"
            git push --quiet origin HEAD:"$TARGET"
          fi
