name: External link check

on:
  schedule:
    # Weekly, Sunday 06:00 UTC.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A scheduled sweep, not a PR gate: external links are flaky (bot throttling, API endpoints that 404
# to HEAD), so it never blocks a merge. It builds the site, checks every off-site link, and opens or
# updates ONE issue ("Broken external links") with the broken ones so the owner can triage. The
# deterministic part (404 page + rss.xml) is separate and runs in the PR gate via the `static` leg.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  check:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-setup
        with:
          need-dist: "true"
      - name: Check external links (404 + rss + off-site links)
        run: node scripts/check-external-links.mjs --json report.json
      - name: Open or update the broken-links issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-link-issue.mjs report.json
