name: PR conflicts

# Labels and comments on open PRs that conflict with master. Each run sweeps all
# open PRs. Untrusted-code safeguard: the only checkout is the default branch
# restricted to .github/scripts; no PR head is ever checked out or executed, even
# for pull_request_target from forks. The script only calls the GitHub API.

on:
  push:
    branches: [master]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-conflicts
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Sweep open PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const modulePath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-conflicts.mjs`;
            const { sweep } = await import(pathToFileURL(modulePath).href);
            await sweep(github, { owner: context.repo.owner, repo: context.repo.repo, log: core.info });
