name: Check setup
description: Checkout, install dependencies, and (optionally) download the built dist artifact.
inputs:
  need-dist:
    description: Download the dist artifact (for checks that read the build output).
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: ${{ inputs.need-dist == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: dist
