name: Playwright env
description: Cache and install the Playwright chromium browser into a workspace dir, then export CHROME_PATH for the checks.
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/pw-browsers
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    - name: Install chromium
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
      run: pnpm exec playwright-core install --with-deps chromium
      shell: bash
    - name: Export CHROME_PATH
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
      run: echo "CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      shell: bash
