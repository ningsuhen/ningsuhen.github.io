d-legend .rough-node .label,#mmd-legend .node .label,#mmd-legend .image-shape .label,#mmd-legend .icon-shape .label{text-align:center;}#mmd-legend .node.clickable{cursor:pointer;}#mmd-legend .root .anchor path{stroke-width:0;}#mmd-legend .arrowheadPath{}#mmd-legend .edgePaths .path{stroke-width:1px;}#mmd-legend .flowchart-link{fill:none;}#mmd-legend .edgeLabel{text-align:center;}#mmd-legend .edgeLabel p{}#mmd-legend .edgeLabel rect{opacity:0.5;}#mmd-legend .labelBkg{}#mmd-legend .cluster rect{stroke-width:1px;}#mmd-legend .cluster text{}#mmd-legend .cluster span{}#mmd-legend .node .collapsed-indicator{stroke:none;opacity:0.6;}#mmd-legend .node .collapsed-separator{stroke-width:0.75px;}#mmd-legend div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Roboto,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;border:1px solid hsl(180, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#mmd-legend .flowchartTitleText{text-anchor:middle;font-size:18px;}#mmd-legend rect.text{fill:none;stroke-width:0;}#mmd-legend .icon-shape,#mmd-legend .image-shape{text-align:center;}#mmd-legend .icon-shape p,#mmd-legend .image-shape p{padding:2px;}#mmd-legend .icon-shape .label rect,#mmd-legend .image-shape .label rect{opacity:0.5;}#mmd-legend .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mmd-legend .node .label-icon path{Color;stroke-width:revert;}#mmd-legend .node .neo-node{}#mmd-legend *{--m-ground:var(--rd-card-bg, #fff);--m-text:var(--rd-text-strong, #1f2430);--m-muted:var(--rd-text-muted, rgba(0, 0, 0, 0.6));--m-line:var(--rd-text-muted, rgba(0, 0, 0, 0.6));--m-neutral:var(--rd-accent, #4a7a9c);font-family:var(--rd-font, Roboto, ui-sans-serif, system-ui, sans-serif);font-size:14px;}#mmd-legend text,#mmd-legend .nodeLabel,#mmd-legend .label text,#mmd-legend .messageText,#mmd-legend .noteText,#mmd-legend .loopText,#mmd-legend .loopText tspan,#mmd-legend .labelText,#mmd-legend .cluster-label text{fill:var(--m-text);stroke:none;font-family:inherit;}#mmd-legend .node rect,#mmd-legend .node polygon,#mmd-legend .node circle,#mmd-legend .node ellipse,#mmd-legend .node path,#mmd-legend .node .label-container{fill:var(--m-ground);stroke:var(--m-neutral);stroke-width:1.5px;}#mmd-legend .node.actor{--m-ink:var(--rd-cat-1, #e69f00);}#mmd-legend .node.compute{--m-ink:var(--rd-cat-2, #0072b2);}#mmd-legend .node.memory{--m-ink:var(--rd-cat-3, #cc79a7);}#mmd-legend .node.control{--m-ink:var(--rd-cat-4, #009e73);}#mmd-legend .node.data{--m-ink:var(--rd-cat-5, #56b4e9);}#mmd-legend .node.external{--m-ink:var(--rd-cat-6, #d55e00);}#mmd-legend .node.good{--m-ink:var(--rd-good, #1b7a4b);}#mmd-legend .node.warn{--m-ink:var(--rd-warn, #9a6b00);}#mmd-legend .node.bad{--m-ink:var(--rd-bad, #c2412d);}#mmd-legend .node.actor rect,#mmd-legend .node.actor polygon,#mmd-legend .node.actor circle,#mmd-legend .node.actor ellipse,#mmd-legend .node.actor path,#mmd-legend .node.compute rect,#mmd-legend .node.compute polygon,#mmd-legend .node.compute circle,#mmd-legend .node.compute ellipse,#mmd-legend .node.compute path,#mmd-legend .node.memory rect,#mmd-legend .node.memory polygon,#mmd-legend .node.memory circle,#mmd-legend .node.memory ellipse,#mmd-legend .node.memory path,#mmd-legend .node.control rect,#mmd-legend .node.control polygon,#mmd-legend .node.control circle,#mmd-legend .node.control ellipse,#mmd-legend .node.control path,#mmd-legend .node.data rect,#mmd-legend .node.data polygon,#mmd-legend .node.data circle,#mmd-legend .node.data ellipse,#mmd-legend .node.data path,#mmd-legend .node.external rect,#mmd-legend .node.external polygon,#mmd-legend .node.external circle,#mmd-legend .node.external ellipse,#mmd-legend .node.external path{fill:color-mix(in srgb, var(--m-ink) 20%, var(--m-ground));stroke:var(--m-ink);stroke-width:2px;}#mmd-legend .node.good rect,#mmd-legend .node.good polygon,#mmd-legend .node.good circle,#mmd-legend .node.good ellipse,#mmd-legend .node.good path,#mmd-legend .node.warn rect,#mmd-legend .node.warn polygon,#mmd-legend .node.warn circle,#mmd-legend .node.warn ellipse,#mmd-legend .node.warn path,#mmd-legend .node.bad rect,#mmd-legend .node.bad polygon,#mmd-legend .node.bad circle,#mmd-legend .node.bad ellipse,#mmd-legend .node.bad path{fill:var(--m-ink);stroke:var(--m-ink);stroke-width:2px;}#mmd-legend .node.good text,#mmd-legend .node.warn text,#mmd-legend .node.bad text{fill:var(--m-ground);font-weight:700;}#mmd-legend .edgePath .path,#mmd-legend .flowchart-link,#mmd-legend .edge-thickness-normal,#mmd-legend .edge-pattern-solid,#mmd-legend .messageLine0,#mmd-legend .messageLine1{stroke:var(--m-line);stroke-width:1.6px;fill:none;}#mmd-legend .edge-pattern-dashed,#mmd-legend .messageLine1{stroke-dasharray:5,4;}#mmd-legend marker,#mmd-legend marker path,#mmd-legend .arrowheadPath,#mmd-legend .marker,#mmd-legend #arrowhead path{fill:var(--m-line);stroke:var(--m-line);}#mmd-legend marker circle{fill:var(--m-ground);}#mmd-legend .edgeLabel,#mmd-legend .edgeLabel rect,#mmd-legend .labelBkg{background-color:var(--m-ground);fill:var(--m-ground);opacity:1;stroke:none;}#mmd-legend .edgeLabel text,#mmd-legend .edgeLabel .label text{fill:var(--m-muted);font-size:14px;}#mmd-legend .cluster rect,#mmd-legend .cluster polygon{fill:var(--rd-btn-bg, #eef2f6);fill-opacity:0.55;stroke:var(--rd-line, rgba(0, 0, 0, 0.1));stroke-width:1.5px;stroke-dasharray:4,3;}#mmd-legend .cluster-label text,#mmd-legend .cluster text{fill:var(--m-muted);font-weight:500;}#mmd-legend rect.actor,#mmd-legend .actor-box{fill:var(--m-ground);stroke:var(--m-neutral);stroke-width:1.5px;}#mmd-legend text.actor,#mmd-legend text.actor tspan{fill:var(--m-text);font-weight:500;}#mmd-legend .actor-line{stroke:var(--rd-line, rgba(0, 0, 0, 0.25));stroke-width:1.2px;}#mmd-legend .note,#mmd-legend rect.note{fill:color-mix(in srgb, var(--rd-cat-1, #e69f00) 18%, var(--m-ground));stroke:var(--rd-cat-1, #e69f00);stroke-width:1.5px;}#mmd-legend .noteText,#mmd-legend .noteText tspan{fill:var(--m-text);}#mmd-legend .activation0,#mmd-legend .activation1,#mmd-legend .activation2{fill:color-mix(in srgb, var(--m-neutral) 25%, var(--m-ground));stroke:var(--m-neutral);}#mmd-legend .labelBox,#mmd-legend .loopLine{fill:var(--rd-btn-bg, #eef2f6);stroke:var(--rd-text-faint, rgba(0, 0, 0, 0.4));}#mmd-legend .labelText,#mmd-legend .labelText tspan{fill:var(--m-text);}#mmd-legend .sequenceNumber{fill:var(--m-ground);}#mmd-legend #sequencenumber{fill:var(--m-line);}#mmd-legend .edge-thickness-invisible{stroke-width:0!important;stroke:none;}#mmd-legend :root{--mermaid-font-family:Roboto,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}</style><g><marker id="mmd-legend_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="mmd-legend_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="mmd-legend_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="mmd-legend_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon points="0,7 11.5,14 11.5,0" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="mmd-legend_flowchart-v2-circl